name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    # ─── Servicios externos requeridos por integration tests ──────────────────
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: quizis_test
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: root123
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    # ─── Variables de entorno para todo el job ────────────────────────────────
    env:
      DATABASE_URL: postgresql://admin:root123@localhost:5432/quizis_test
      JWT_ACCESS_SECRET: test-access-secret-ci
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_SECRET: test-refresh-secret-ci
      JWT_REFRESH_EXPIRES_IN: 7d
      JWT_ROOM_SECRET: test-room-secret-ci
      JWT_ROOM_EXPIRES_IN: 1h
      NODE_ENV: test
      PORT: 3001
      CORS_ORIGIN: http://localhost:4200
      REDIS_URL: redis://localhost:6379
      OPENAI_API_KEY: test-key

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
        working-directory: backend

      - name: Generate Prisma Client
        run: pnpm exec prisma generate
        working-directory: backend

      - name: Run Lint
        run: pnpm run lint
        working-directory: backend

      - name: Run Unit Tests
        run: pnpm run test
        working-directory: backend

      - name: Run Prisma Migrations (test DB)
        run: pnpm exec prisma migrate deploy
        working-directory: backend

      - name: Run Integration Tests
        run: pnpm run test:integration
        working-directory: backend

      - name: Run Build
        run: pnpm run build
        working-directory: backend
