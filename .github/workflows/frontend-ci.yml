name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "frontend/**"
  pull_request:
    branches: [main, develop]
    paths:
      - "frontend/**"

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install
        working-directory: frontend

      - name: Run Lint
        run: pnpm run lint
        working-directory: frontend

      - name: Run Tests
        run: pnpm run test --no-watch
        working-directory: frontend

      - name: Run Build
        run: pnpm run build
        working-directory: frontend

      # N1: ensure the deprecated WebSocket mutations are not reintroduced.
      # These were moved to REST in sdd/quizis-rest-n1-mutations.
      - name: Verify no deprecated WS mutations
        run: |
          failed=0
          grep -rn "socket.emit('responder_pregunta'" frontend/src/ && failed=1 || true
          grep -rn "socket.emit('cambiar_estado_sala'" frontend/src/ && failed=1 || true
          grep -rn "socket.emit('pregunta_liberada'" frontend/src/ && failed=1 || true
          if [ "$failed" -eq 1 ]; then
            echo "❌ Found deprecated WS mutation calls"
            exit 1
          fi
          echo "✓ No deprecated WS mutation calls found"
