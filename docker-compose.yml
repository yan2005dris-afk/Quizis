# =============================================================================
# Docker Compose — Quizis local development environment
# 4 services: postgres, redis, backend (NestJS), frontend (Angular + Nginx)
# Bridge network for service discovery + healthchecks for startup gating
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: quizis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizisdb}
      POSTGRES_USER: ${POSTGRES_USER:-quizisuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizispass}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizisuser} -d ${POSTGRES_DB:-quizisdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quizis-network

  # ---------------------------------------------------------------------------
  # Redis 7 — cache / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: quizis-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quizis-network

  # ---------------------------------------------------------------------------
  # Backend — NestJS API server (port 3000)
  # ---------------------------------------------------------------------------
  quizis-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quizis-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quizisuser}:${POSTGRES_PASSWORD:-quizispass}@postgres:5432/${POSTGRES_DB:-quizisdb}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quizis-network

  # ---------------------------------------------------------------------------
  # Frontend — Angular SPA served by Nginx (port 80)
  # ---------------------------------------------------------------------------
  quizis-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: quizis-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - quizis-backend
    networks:
      - quizis-network

# ---------------------------------------------------------------------------
# Persistent storage for stateful services
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

# ---------------------------------------------------------------------------
# Isolated bridge network with built-in DNS resolution
# ---------------------------------------------------------------------------
networks:
  quizis-network:
    driver: bridge
