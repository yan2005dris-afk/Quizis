# =============================================================================
# Docker Compose — Quizis
# 5 services: postgres, redis, backend (NestJS), frontend (Angular + Nginx),
#             cloudflared (tunnel Cloudflare Zero Trust)
# Bridge network for service discovery + healthchecks for startup gating
#
# Puertos parametrizados para evitar conflictos en producción.
# Límites de hardware: 512 MB de RAM por servicio.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: quizis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizisdb}
      POSTGRES_USER: ${POSTGRES_USER:-quizisuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-quizispass}
    ports:
      - "${QUIZIS_POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-quizisuser} -d ${POSTGRES_DB:-quizisdb}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis 7 — cache / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: quizis-redis
    restart: unless-stopped
    ports:
      - "${QUIZIS_REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Backend — NestJS API server (port 3000 interno)
  # ---------------------------------------------------------------------------
  quizis-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quizis-backend
    restart: unless-stopped
    ports:
      - "${QUIZIS_BACKEND_PORT:-3000}:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quizisuser}:${POSTGRES_PASSWORD:-quizispass}@postgres:5432/${POSTGRES_DB:-quizisdb}
      - REDIS_URL=redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Frontend — Angular SPA served by Nginx (port 80 interno)
  # ---------------------------------------------------------------------------
  quizis-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: quizis-frontend
    restart: unless-stopped
    ports:
      - "${QUIZIS_FRONTEND_PORT:-80}:80"
    depends_on:
      - quizis-backend
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — expose Nginx (:80) via Cloudflare Zero Trust
  # No necesita puerto, sale hacia Cloudflare por QUIC/HTTP2
  # En el dashboard, Public Hostname apunta a quizis-frontend:80
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: quizis-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

# ---------------------------------------------------------------------------
# Persistent storage for stateful services
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

# ---------------------------------------------------------------------------
# Isolated bridge network with built-in DNS resolution
# ---------------------------------------------------------------------------
networks:
  quizis-network:
    driver: bridge
