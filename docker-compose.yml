# =============================================================================
# Docker Compose — Quizis
# 6 services: postgres, redis, quizis-migrate (one-shot), backend, frontend,
#             cloudflared (tunnel).
# Service gating: every consumer waits on a healthy upstream via depends_on
# conditions. quizis-migrate is a one-shot that the backend blocks on with
# service_completed_successfully.
#
# Ports parameterized via .env to avoid prod conflicts.
# Hardware caps: 512 MB per service.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 16 — primary database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: quizis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-quizisdb}
      POSTGRES_USER: ${POSTGRES_USER:-quizisuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - '${QUIZIS_POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          pg_isready -U ${POSTGRES_USER:-quizisuser}
          -d ${POSTGRES_DB:-quizisdb}
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Redis 7 — cache / session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: quizis-redis
    restart: unless-stopped
    ports:
      - '${QUIZIS_REDIS_PORT:-6379}:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # quizis-migrate — one-shot Prisma migrations runner
  # Uses the same backend image. Applies pending migrations, exits.
  # The backend blocks on this via service_completed_successfully so it never
  # starts serving traffic before the schema is current.
  # Seed is intentionally NOT run here — run it manually when needed:
  #   docker compose run --rm quizis-migrate -- db seed
  # ---------------------------------------------------------------------------
  quizis-migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quizis-migrate
    restart: 'no'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quizisuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quizisdb}
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ['node', 'node_modules/prisma/build/index.js']
    command: ['migrate', 'deploy']
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Backend — NestJS API server (port 3000 internal)
  # ---------------------------------------------------------------------------
  quizis-backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: quizis-backend
    restart: unless-stopped
    ports:
      - '${QUIZIS_BACKEND_PORT:-3000}:3000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-quizisuser}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-quizisdb}
      - REDIS_URL=redis://redis:6379
    depends_on:
      quizis-migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # node's built-in http — no extra packages needed in the image.
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          node -e "require('http').get('http://localhost:3000/api/v1/health',
          (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error',
          () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Frontend — Angular SPA served by Nginx (port 80 internal)
  # ---------------------------------------------------------------------------
  quizis-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: quizis-frontend
    restart: unless-stopped
    ports:
      - '${QUIZIS_FRONTEND_PORT:-80}:80'
    depends_on:
      quizis-backend:
        condition: service_healthy
    # busybox's wget is present in nginx:alpine — no extra packages needed.
    healthcheck:
      test: ['CMD-SHELL', 'wget -q --spider http://127.0.0.1/ || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel — expose Nginx (:80) via Cloudflare Zero Trust
  # Pinned to a specific version for reproducible builds (no :latest drift).
  # In the Cloudflare dashboard, Public Hostname targets quizis-frontend:80.
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:2025.11.1
    container_name: quizis-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    depends_on:
      quizis-frontend:
        condition: service_healthy
    networks:
      - quizis-network
    deploy:
      resources:
        limits:
          memory: 512M

# ---------------------------------------------------------------------------
# Persistent storage for stateful services
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

# ---------------------------------------------------------------------------
# Isolated bridge network with built-in DNS resolution
# ---------------------------------------------------------------------------
networks:
  quizis-network:
    driver: bridge
