server {
    listen 80;
    server_name localhost dihm-muertos.site www.dihm-muertos.site;
    root /usr/share/nginx/html;
    index index.csr.html index.html;

    # DNS Resolver para que Nginx encuentre a Render (Google DNS)
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    absolute_redirect off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;

    # --- PROXY INTELIGENTE (Corregido) ---
    location /api/ {
        # Intentar local
        proxy_pass http://quizis-backend:3000;
        
        proxy_intercept_errors on;
        error_page 502 503 504 = @fallback_to_render;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket para Socket.IO
    location /socket.io/ {
        proxy_pass http://quizis-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Bloque de Fallback (Sin la ruta al final del proxy_pass)
    location @fallback_to_render {
        # Importante: Solo el dominio, sin '/api/' al final
        proxy_pass https://quizis-zvhd.onrender.com;
        
        proxy_set_header Host quizis-zvhd.onrender.com;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;

        # Forzar CORS para que el navegador no de 'Status 0'
        proxy_hide_header 'Access-Control-Allow-Origin';
        add_header 'Access-Control-Allow-Origin' '$http_origin' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS, PUT, DELETE' always;
        add_header 'Access-Control-Allow-Headers' 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization' always;
    }

    location / {
        try_files $uri $uri/ /index.csr.html =404;
    }
}
