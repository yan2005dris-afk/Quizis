<div class="vote-shell">
  <div class="question">
    <h2 *ngIf="currentQuestion()">{{ currentQuestion()!.prompt }}</h2>
    <h2 *ngIf="!currentQuestion()">Pantalla bloqueada</h2>
  </div>

  <div class="options">
    <button class="option" [class.selected]="selectedOption() === 'A'" (click)="selectOption('A')" [disabled]="!canVote()">A</button>
    <button class="option" [class.selected]="selectedOption() === 'B'" (click)="selectOption('B')" [disabled]="!canVote()">B</button>
    <button class="option" [class.selected]="selectedOption() === 'C'" (click)="selectOption('C')" [disabled]="!canVote()">C</button>
    <button class="option" [class.selected]="selectedOption() === 'D'" (click)="selectOption('D')" [disabled]="!canVote()">D</button>
  </div>
</div>
