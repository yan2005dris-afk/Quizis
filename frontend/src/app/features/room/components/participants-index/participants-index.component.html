@if (participantes().length === 0) {
  <p class="pl__empty">Nadie conectado aún</p>
} @else {
  <ul class="pl__list" aria-label="Lista de participantes en línea">
    @for (p of participantes(); track p.id) {
      <li class="pl__item">
        <span class="pl__avatar" aria-hidden="true">{{ p.nombre.charAt(0).toUpperCase() }}</span>
        <span class="pl__name">{{ p.nombre }}</span>
        <span class="pl__online-dot" title="En línea" aria-label="En línea"></span>
      </li>
    }
  </ul>
}
