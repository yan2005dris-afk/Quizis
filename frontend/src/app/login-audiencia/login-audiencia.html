<div class="login-container">
  <div class="login-card">
    
    <div class="login-header">
      <h1>Quizis</h1>
      <p>Panel de Audiencia Móvil</p>
    </div>

    <form class="login-form" (ngSubmit)="ingresarALaSala()">
      
      <div class="form-group">
        <label for="tokenSala">Enlace de Acceso Seguro (Cifrado)</label>
        <input 
          type="text" 
          id="tokenSala" 
          [ngModel]="tokenSala()" 
          name="tokenSala"
          disabled
          style="opacity: 0.6; cursor: not-allowed; border-color: rgba(0, 229, 255, 0.3); text-shadow: 0 0 5px rgba(0, 229, 255, 0.3);"
        >
      </div>

      <div class="form-group">
        <label for="nombreAlumno">Tu Nombre Completo</label>
        <input 
          type="text" 
          id="nombreAlumno" 
          [ngModel]="nombreAlumno()"
          (ngModelChange)="nombreAlumno.set($event)"
          name="nombreAlumno" 
          placeholder="Ej: Steven Muñoz" 
          maxlength="20"
          autocomplete="off"
        >
      </div>

      <button type="submit" class="btn-ingresar">
        Validar y Entrar a la Sala
      </button>

    </form>

  </div>
</div>
