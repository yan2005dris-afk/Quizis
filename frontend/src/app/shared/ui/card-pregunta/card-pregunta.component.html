<article
  class="card-pregunta"
  role="region"
  [attr.aria-label]="'Pregunta ' + numeroPregunta() + ' de ' + totalPreguntas()">

  <header class="card-pregunta__header">
    <span class="card-pregunta__contador">
      {{ numeroPregunta() }} / {{ totalPreguntas() }}
    </span>
  </header>

  <div class="card-pregunta__body">
    <p class="card-pregunta__texto">{{ pregunta() }}</p>
  </div>

  <div class="card-pregunta__opciones" role="list">
    @for (opcion of opciones(); track opcion.id; let i = $index) {
      <button
        role="listitem"
        class="card-pregunta__opcion"
        [class.card-pregunta__opcion--selected]="opcionElegidaId() === opcion.id"
        [class.card-pregunta__opcion--dimmed]="opcionElegidaId() !== null && opcionElegidaId() !== opcion.id"
        [disabled]="bloqueado() || opcionElegidaId() !== null"
        [attr.aria-pressed]="opcionElegidaId() === opcion.id"
        type="button"
        (click)="elegir(opcion)">
        <span class="card-pregunta__letra">{{ letras[i] }}</span>
        <span class="card-pregunta__opcion-texto">{{ opcion.texto }}</span>
      </button>
    }
  </div>
</article>
