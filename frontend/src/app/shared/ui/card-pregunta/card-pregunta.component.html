<article
  class="card-pregunta"
  role="region"
  [attr.aria-label]="'Pregunta ' + numeroPregunta() + ' de ' + totalPreguntas()"
>
  <div class="card-pregunta__main-box">
    <div class="card-pregunta__body">
      <h1 class="card-pregunta__texto">{{ pregunta() }}</h1>
    </div>

    <div class="card-pregunta__opciones" role="list">
      @for (opcion of opciones(); track opcion.id; let i = $index) {
        <button
          role="listitem"
          class="card-pregunta__opcion"
          [class.card-pregunta__opcion--selected]="estaSeleccionada(opcion.id)"
          [disabled]="bloqueado()"
          [attr.aria-pressed]="estaSeleccionada(opcion.id)"
          type="button"
          (click)="alternarSeleccion(opcion)"
        >
          <span class="card-pregunta__letra">{{ obtenerLetra(i) }}</span>
          <span class="card-pregunta__opcion-texto">{{ opcion.texto }}</span>
        </button>
      }
    </div>
  </div>

  <div class="card-pregunta__actions">
    <button
      type="button"
      class="card-pregunta__btn-confirmar"
      [disabled]="opcionesElegidasIds().length === 0 || bloqueado()"
      (click)="enviarRespuesta()"
    >
      Confirmar Respuesta
    </button>
  </div>
</article>
